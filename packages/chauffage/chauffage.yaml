# =====================================================================
#  Home Assistant package: weekly heating schedules (Versatile Thermostat)
#  ha-chauffage 0.2.0-beta.2 — https://github.com/armellarcier/ha-chauffage
#  Installed in <config>/packages/chauffage/ (see README.md)
#
#  Schedules are edited with the custom:chauffage-programme-card card and stored in the
#  "programmes" attribute of sensor.programmes_chauffage:
#    { climate.salon: { Normal: [ [mon], [tue], ... [sun] ], Absent: ..., Vacances: ... }, ... }
#  each day being a list of "HH:MM preset" slots (the first one at 00:00). The "version"
#  attribute is the schema version of that data: the card migrates older data (see
#  CONTRIBUTING.md, "Data versions and migrations").
#
#  Overrides: a manual setpoint or preset change (not made by the schedule) creates a
#  temporary override, stored in sensor.derogations_chauffage:
#    { climate.salon: { type: temp|preset, valeur: 21|boost, debut: ISO, fin: ISO }, ... }
#  When it ends (or is removed from the card), the thermostat resumes its schedule.
#
#  Entity names, events and stored keys are in French; see ROADMAP.md (internationalization).
# =====================================================================

input_select:
  mode_chauffage:
    name: Mode de chauffage
    icon: mdi:home-thermometer
    options:
      - Normal
      - Absent
      - Vacances

template:
  # Schedule storage: updated by the card (event), restored automatically when HA restarts.
  - triggers:
      - trigger: event
        event_type: chauffage_programmes_set
    sensor:
      - name: Programmes chauffage
        unique_id: programmes_chauffage
        icon: mdi:calendar-clock
        state: "{{ now().isoformat() }}"
        attributes:
          programmes: "{{ trigger.event.data.programmes }}"
          # Schema version of "programmes" (missing in data saved before v0.1.0: version 1)
          version: "{{ trigger.event.data.version | default(1) }}"
          # Data as it was before the last migration, kept until the next one
          previous: >
            {{ trigger.event.data.previous if 'previous' in trigger.event.data
               else (this.attributes.previous | default(none)) }}

  # Override storage: each event creates / updates (derogation = {...}) or removes
  # (derogation = null) one thermostat's override.
  - triggers:
      - trigger: event
        event_type: chauffage_derogation_set
    sensor:
      - name: Dérogations chauffage
        unique_id: derogations_chauffage
        icon: mdi:timer-cog-outline
        state: "{{ now().isoformat() }}"
        attributes:
          # "{%-" / "-%}" trim the whitespace produced by the tags (keeps the rendered value clean).
          derogations: >
            {%- set climate = trigger.event.data.climate -%}
            {%- set current = this.attributes.derogations | default({}) -%}
            {%- set ns = namespace(d={}) -%}
            {%- for k, v in (current if current is mapping else {}).items() if k != climate -%}
              {%- set ns.d = dict(ns.d, **{k: v}) -%}
            {%- endfor -%}
            {%- if trigger.event.data.derogation -%}
              {%- set ns.d = dict(ns.d, **{climate: trigger.event.data.derogation}) -%}
            {%- endif -%}
            {{- ns.d -}}

  # Thermostat tracking, with no list to maintain: the thermostats used in the schedules.
  # Updated as soon as a setpoint or preset changes (HA tracks the entities read by the template).
  - sensor:
      - name: Suivi vannes chauffage
        unique_id: suivi_vannes_chauffage
        icon: mdi:radiator
        state: "{{ (state_attr('sensor.programmes_chauffage', 'programmes') or {}) | count }}"
        attributes:
          vannes: >
            {%- set ns = namespace(d={}) -%}
            {%- for ent in (state_attr('sensor.programmes_chauffage', 'programmes') or {}).keys() | sort -%}
              {%- if states(ent) not in ['unknown', 'unavailable'] -%}
                {#- Some integrations (ZHA…) expose an Enum (<Preset.NONE: 'none'>) instead of
                    text: take its value, otherwise HA stores the whole attribute as text -#}
                {%- set p = state_attr(ent, 'preset_mode') -%}
                {%- set p = p.value if p.value is defined else p -%}
                {%- set t = state_attr(ent, 'temperature') -%}
                {%- set ns.d = dict(ns.d, **{ent: {
                     't': t | float(none),
                     'p': p | string if p is not none else none,
                     'off': is_state(ent, 'off')}}) -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.d -}}

automation:
  - id: chauffage_programmes_hebdo
    alias: "Chauffage - programmes hebdomadaires"
    description: >
      Applies each thermostat's preset according to the selected mode
      (Normal / Absent / Vacances), the day and the time. Thermostats with an active
      override are left alone until it ends.
    mode: queued
    triggers:
      # Every minute: a slot starts, or an override ends
      - trigger: time_pattern
        minutes: "*"
        id: minute
      # Mode changed, schedules saved or HA started: realign everything
      - trigger: state
        entity_id: input_select.mode_chauffage
        id: force
      - trigger: state
        entity_id: sensor.programmes_chauffage
        id: force
      - trigger: homeassistant
        event: start
        id: force
      # Override removed from the card: the thermostat resumes its schedule
      - trigger: event
        event_type: chauffage_derogation_set
        id: override

    variables:
      # - "minute" trigger: only thermostats whose slot starts now, or whose override just ended.
      # - "force" trigger: realigns every thermostat (except those with an active override).
      # - A Versatile Thermostat turned "off" (summer) is ignored.
      overrides: >
        {%- set d = state_attr('sensor.derogations_chauffage', 'derogations') -%}
        {{- d if d is mapping else {} -}}
      ended: >
        {%- set ns = namespace(l=[]) -%}
        {%- for ent, o in overrides.items() -%}
          {%- if o is not mapping or not o.fin or as_datetime(o.fin) is none or as_datetime(o.fin) <= now() -%}{%- set ns.l = ns.l + [ent] -%}{%- endif -%}
        {%- endfor -%}
        {{- ns.l -}}
      targets: >
        {%- set schedules = state_attr('sensor.programmes_chauffage', 'programmes') or {} -%}
        {%- set mode = states('input_select.mode_chauffage') -%}
        {%- set weekday = now().weekday() -%}
        {%- set hm = now().strftime('%H:%M') -%}
        {%- set force = trigger.id == 'force' -%}
        {%- set resumed = trigger.event.data.climate
             if trigger.id == 'override' and not trigger.event.data.derogation else none -%}
        {%- set ns = namespace(l=[]) -%}
        {%- for ent, modes in schedules.items() -%}
          {%- set week = modes.get(mode) -%}
          {# ent == resumed: the sensor may not have processed the removal yet #}
          {%- set overridden = ent in overrides and ent not in ended and ent != resumed -%}
          {%- if week and week | count == 7 and not overridden -%}
            {%- set slot = namespace(preset=none, starts_now=false) -%}
            {%- for s in week[weekday] -%}
              {%- set h = s.split(' ')[0] -%}
              {%- if h <= hm -%}
                {%- set slot.preset = s.split(' ')[1] -%}
                {%- set slot.starts_now = (h == hm) -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set current = state_attr(ent, 'preset_mode') -%}
            {%- set current = (current.value if current.value is defined else current) | string -%}
            {%- if slot.preset is not none
                  and (force or slot.starts_now or ent == resumed or ent in ended)
                  and states(ent) not in ['off', 'unavailable', 'unknown']
                  and current != slot.preset -%}
              {%- set ns.l = ns.l + [{'entity': ent, 'preset': slot.preset}] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{- ns.l -}}

    conditions:
      - condition: template
        value_template: "{{ targets | count > 0 or ended | count > 0 }}"

    actions:
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            # continue_on_error: an unreachable valve (e.g. Zigbee NWK_NO_ROUTE)
            # must not prevent the others from being updated
            - action: climate.set_preset_mode
              continue_on_error: true
              target:
                entity_id: "{{ repeat.item.entity }}"
              data:
                preset_mode: "{{ repeat.item.preset }}"
            # Short delay so as not to flood the Zigbee network
            - delay:
                milliseconds: 300
      # Remove ended overrides
      - repeat:
          for_each: "{{ ended }}"
          sequence:
            - event: chauffage_derogation_set
              event_data:
                climate: "{{ repeat.item }}"
                derogation: null

  - id: chauffage_derogation_manuelle
    alias: "Chauffage - dérogation manuelle"
    description: >
      A setpoint or preset changed by hand (not by the schedule) becomes a temporary
      override. When it ends, the thermostat resumes its schedule.
    mode: queued
    triggers:
      # The tracking sensor changes as soon as a thermostat's setpoint or preset changes
      - trigger: state
        entity_id: sensor.suivi_vannes_chauffage

    variables:
      # Default override duration, in minutes
      default_duration: 120
      # preset_mode values meaning "manual setpoint" (shown as "Manuel" in French)
      manual_presets: ['', 'none', 'manual', 'manuel']
      # Thermostats whose setpoint / preset has just been changed by hand
      changes: >
        {%- set before = trigger.from_state.attributes.vannes if trigger.from_state else none -%}
        {%- set after = trigger.to_state.attributes.vannes if trigger.to_state else none -%}
        {%- set before = before if before is mapping else {} -%}
        {%- set after = after if after is mapping else {} -%}
        {%- set ns = namespace(l=[]) -%}
        {%- for ent, a in after.items() if ent in before and not a.off -%}
          {%- set b = before[ent] -%}
          {%- set ctx = states[ent].context if states[ent] else none -%}
          {# Change that does not come from an automation (hence not from the schedule) #}
          {%- if ctx and ctx.parent_id is none -%}
            {%- set manual = a.p is none or (a.p | string | lower) in manual_presets -%}
            {%- if manual and a.t is not none and (a.t != b.t or a.p != b.p) -%}
              {# Setpoint changed by hand: Versatile Thermostat switches to its manual preset #}
              {%- set ns.l = ns.l + [{'climate': ent, 'type': 'temp', 'value': a.t}] -%}
            {%- elif not manual and a.p != b.p and ctx.user_id is not none -%}
              {# Preset picked by a user #}
              {%- set ns.l = ns.l + [{'climate': ent, 'type': 'preset', 'value': a.p}] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{- ns.l -}}

    conditions:
      - "{{ changes | count > 0 }}"

    actions:
      - repeat:
          for_each: "{{ changes }}"
          sequence:
            - event: chauffage_derogation_set
              event_data:
                climate: "{{ repeat.item.climate }}"
                derogation:
                  type: "{{ repeat.item.type }}"
                  valeur: "{{ repeat.item.value }}"
                  debut: "{{ now().replace(microsecond=0).isoformat() }}"
                  fin: "{{ (now() + timedelta(minutes=default_duration)).replace(microsecond=0).isoformat() }}"
