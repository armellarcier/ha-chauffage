name: Tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  carte:
    name: Carte (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  logique-ha:
    name: Logique HA (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/ha/requirements.txt
      - run: pip install -r tests/ha/requirements.txt
      - run: python -m pytest -c tests/ha/pytest.ini
