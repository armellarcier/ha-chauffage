name: Tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  card:
    name: Card (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  python:
    name: ${{ matrix.name }} (Python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: HA package
            suite: tests/ha
            requirements: tests/ha/requirements.txt
          - name: Integration
            suite: tests/integration
            requirements: tests/ha/requirements.txt
          # Minimum supported Home Assistant (hacs.json)
          - name: HA package, HA 2026.9
            suite: tests/ha
            requirements: tests/ha/requirements-min.txt
          - name: Integration, HA 2026.9
            suite: tests/integration
            requirements: tests/ha/requirements-min.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - run: pip install -r ${{ matrix.requirements }}
      - run: python -m pytest -c ${{ matrix.suite }}/pytest.ini ${{ matrix.suite }}

  # Home Assistant's and HACS's checks of the integration (manifest, translations, layout)
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
