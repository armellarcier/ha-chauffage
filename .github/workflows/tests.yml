name: Tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  card:
    name: Card (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tests with coverage; fails below 95 % of the lines (package.json, "coverage")
      - run: npm run coverage
      - name: Coverage percentage
        run: |
          node -e '
            const lines = require("fs").readFileSync("lcov.info", "utf8").split("\n");
            const sum = (k) => lines.filter((l) => l.startsWith(k + ":")).reduce((s, l) => s + Number(l.slice(k.length + 1)), 0);
            const pct = Math.floor((1000 * sum("LH")) / sum("LF")) / 10;
            require("fs").writeFileSync("coverage-card.txt", String(pct));
            console.log(`card coverage: ${pct} %`);'
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-card
          path: coverage-card.txt

  python:
    name: ${{ matrix.name }} (Python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Supported Home Assistant versions (CONTRIBUTING.md): the latest release, the minimum, one
      # version per quarter since, and both sides of a version check in the code.
      # test_supported_versions.py asks for the missing quarters when the latest one moves on.
      matrix:
        include:
          # Latest release (requirements.txt, moved forward by Dependabot)
          - name: Integration
            requirements: tests/integration/requirements.txt
            python: "3.14"
            # Fails below 97 % of the lines
            coverage: --cov=custom_components/chauffage --cov-report=term --cov-report=json:coverage.json --cov-fail-under=97
          # Minimum supported Home Assistant (hacs.json)
          - name: Integration, HA 2025.1
            ha: "2025.1"
            requirements: tests/integration/requirements-min.txt
            python: "3.13"
          # pytest-homeassistant-custom-component that ships each Home Assistant, on its Python.
          # pip installs the dependencies HA does not pin at their latest version: some no longer
          # work with an older HA and are pinned back (pins, as in requirements-min.txt).
          - { name: "Integration, HA 2025.4", ha: "2025.4", phcc: "0.13.232", python: "3.13", pins: "pycares<5 josepy<2" }
          - { name: "Integration, HA 2025.7", ha: "2025.7", phcc: "0.13.260", python: "3.13", pins: "pycares<5" }
          # From 2025.8, sensors are attached to the thermostat's device by device_entry (sensor.py)
          - { name: "Integration, HA 2025.8", ha: "2025.8", phcc: "0.13.269", python: "3.13", pins: "pycares<5" }
          - { name: "Integration, HA 2025.10", ha: "2025.10", phcc: "0.13.285", python: "3.13", pins: "pycares<5" }
          - { name: "Integration, HA 2026.1", ha: "2026.1", phcc: "0.13.305", python: "3.13" }
          - { name: "Integration, HA 2026.4", ha: "2026.4", phcc: "0.13.321", python: "3.14" }
          - { name: "Integration, HA 2026.7", ha: "2026.7", phcc: "0.13.344", python: "3.14" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements || '.github/workflows/tests.yml' }}
      # Through variables: in the command, "<5" would be read by the shell as a redirection
      - run: pip install ${REQUIREMENTS:+-r "$REQUIREMENTS"} ${PHCC:+pytest-homeassistant-custom-component==$PHCC} $PINS
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
          PHCC: ${{ matrix.phcc }}
          PINS: ${{ matrix.pins }}
      - run: python -m pytest -c tests/integration/pytest.ini tests/integration ${{ matrix.coverage }}
      - name: Coverage percentage
        if: matrix.coverage
        run: python -c "import json; print(int(json.load(open('coverage.json'))['totals']['percent_covered']))" > coverage-integration.txt
      - uses: actions/upload-artifact@v7
        if: matrix.coverage
        with:
          name: coverage-integration
          path: coverage-integration.txt

  # Home Assistant's and HACS's checks of the integration (manifest, translations, layout)
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  # Coverage badges of the README: shields.io endpoint files on the "badges" branch (no
  # external service). Updated by pushes to main only.
  badges:
    name: Coverage badges
    needs: [card, python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish the badges
        run: |
          badge() {
            pct=$(cat "coverage-$1.txt")
            color=$(awk -v p="$pct" 'BEGIN { print (p >= 95 ? "brightgreen" : p >= 85 ? "yellow" : "red") }')
            printf '{"schemaVersion":1,"label":"%s","message":"%s%%","color":"%s"}\n' "$2" "$pct" "$color" > "out/coverage-$1.json"
          }
          mkdir out
          badge integration "coverage (integration)"
          badge card "coverage (card)"
          cd out
          git init -q -b badges
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -q -m "Coverage badges for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" badges
