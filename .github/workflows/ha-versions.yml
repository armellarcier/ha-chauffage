name: Older Home Assistant versions

# Tries the integration tests on Home Assistant versions older than the minimum, to see how far
# down the minimum can go (see CONTRIBUTING.md, "Supported Home Assistant versions"). One entry
# per version, run side by side; runs by hand from the Actions tab, or when this file changes
# (edit the matrix to try other versions). It never blocks a push or a release.
on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/ha-versions.yml]

jobs:
  python:
    name: Integration, HA ${{ matrix.ha }} (Python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # pytest-homeassistant-custom-component that ships each Home Assistant, on its Python.
          # pip installs the dependencies HA does not pin at their latest version: some no longer
          # work with an old HA and are pinned back (pins).
          - { ha: "2025.10", phcc: "0.13.285", python: "3.13", pins: "pycares<5" }
          - { ha: "2025.7", phcc: "0.13.260", python: "3.13", pins: "pycares<5" }
          - { ha: "2025.4", phcc: "0.13.232", python: "3.13", pins: "pycares<5 josepy<2" }
          - { ha: "2025.1", phcc: "0.13.201", python: "3.12", pins: "pycares<5 josepy<2" }
          - { ha: "2024.10", phcc: "0.13.171", python: "3.12", pins: "pycares<5 josepy<2" }
          - { ha: "2024.7", phcc: "0.13.144", python: "3.12", pins: "pycares<5 josepy<2" }
          - { ha: "2024.4", phcc: "0.13.111", python: "3.12", pins: "pycares<5 josepy<2" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest-homeassistant-custom-component==${{ matrix.phcc }} ${{ matrix.pins }}
      - run: python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
      - run: python -m pytest -c tests/integration/pytest.ini tests/integration
