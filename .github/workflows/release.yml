name: Release

# Pushing a tag vX.Y.Z publishes the GitHub release (see CONTRIBUTING.md, "Releasing"):
# tests, version check, the card built, the ZIP that HACS installs, notes from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    # The reused workflow declares a job that can write (coverage badges, main branch only)
    permissions:
      contents: write

  release:
    name: Publish
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        run: |
          # The card takes its version from the manifest
          version="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$version\"" custom_components/chauffage/manifest.json \
            || { echo "::error::Tag $GITHUB_REF_NAME does not match the version in manifest.json"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::No CHANGELOG.md entry for $version"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Build the card
        run: npm ci && npm run build

      - name: Build the ZIP
        run: |
          # HACS unzips it into custom_components/chauffage/ (hacs.json: zip_release, filename).
          # Without HACS, unzip it there too.
          cd custom_components/chauffage
          zip -r ../../ha-chauffage.zip . -x '*__pycache__*' -x frontend/.gitignore
          unzip -l ../../ha-chauffage.zip | grep -q ' frontend/chauffage-programme-card.js$' \
            || { echo "::error::The ZIP has no card"; exit 1; }

      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { on = index($0, "[" v "]") > 0; next } on && !/^\[[^]]+\]: /' CHANGELOG.md > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ha-chauffage.zip \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
