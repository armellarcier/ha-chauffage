# Development HA, disposable and isolated from any real installation.
#   docker compose -f dev/compose.yaml up -d      → http://localhost:8124
#   docker compose -f dev/compose.yaml restart homeassistant   (a few seconds)
#   docker compose -f dev/compose.yaml down
# The repository is mounted live: www/, packages/chauffage/ and custom_components/chauffage/
# are seen immediately (Python changes need a restart).
name: ha-chauffage-dev

services:
  # Installs Versatile Thermostat into dev/hass/custom_components (once per version)
  vtherm:
    image: alpine:3.20
    volumes:
      - ./hass:/config
    environment:
      VTHERM_VERSION: ${VTHERM_VERSION:-10.5.0}
    command:
      - sh
      - -c
      - |
        set -e
        d=/config/custom_components/versatile_thermostat
        if [ "$$(cat $$d/.version 2>/dev/null)" = "$$VTHERM_VERSION" ]; then
          echo "Versatile Thermostat $$VTHERM_VERSION already installed"; exit 0
        fi
        rm -rf "$$d" && mkdir -p "$$d"
        wget -qO /tmp/vt.zip "https://github.com/jmcollin78/versatile_thermostat/releases/download/$$VTHERM_VERSION/versatile_thermostat.zip"
        unzip -q /tmp/vt.zip -d "$$d"
        echo "$$VTHERM_VERSION" > "$$d/.version"
        echo "Versatile Thermostat $$VTHERM_VERSION installed"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION:-stable}
    depends_on:
      vtherm:
        condition: service_completed_successfully
    ports:
      - "8124:8123"
    environment:
      TZ: Europe/Paris
    volumes:
      - ./hass:/config
      - ../www:/config/www/chauffage:ro
      - ../packages/chauffage:/config/packages/chauffage:ro
      - ../custom_components/chauffage:/config/custom_components/chauffage:ro
    restart: unless-stopped

  # First-run setup through HA's APIs (user dev / dev, token, thermostats, dashboard,
  # sample schedules). Idempotent: skips what is already done, then exits.
  setup:
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION:-stable}
    depends_on:
      homeassistant:
        condition: service_started
    entrypoint: ["python3", "/setup/setup.py"]
    volumes:
      - ./setup:/setup:ro
      - ./hass:/config
    restart: "no"
