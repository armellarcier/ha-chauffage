# Configuration of the development HA (dev/compose.yaml).
default_config:

homeassistant:
  name: Chauffage (dev)
  time_zone: Europe/Paris
  # packages/simulation.yaml = virtual rooms. The card is served by the integration.
  packages: !include_dir_named packages

recorder:
  purge_keep_days: 2

logger:
  default: warning
  logs:
    custom_components.versatile_thermostat: info
    homeassistant.components.automation: info
    homeassistant.components.template: info
