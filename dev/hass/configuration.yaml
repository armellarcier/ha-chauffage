# Configuration of the development HA (dev/compose.yaml).
default_config:

homeassistant:
  name: Chauffage (dev)
  time_zone: Europe/Paris
  language: fr  # presets and schedules are created with French names
  # packages/simulation.yaml = virtual rooms. The card is served by the integration.
  packages: !include_dir_named packages

# The temperatures of the rooms (thermal model) and the week of history of a new dev HA
sim_rooms:

recorder:
  purge_keep_days: 10  # the card shows the last 7 days (a new dev HA starts with a simulated week)

logger:
  default: warning
  logs:
    custom_components.versatile_thermostat: info
    homeassistant.components.automation: info
    homeassistant.components.template: info
