# Virtual rooms for the dev HA: each room has a heater (input_boolean, usable as the
# underlying switch of a Versatile Thermostat "over a switch") and a temperature that rises
# while the heater is on and drifts back towards the outdoor temperature otherwise.
# The input_number sliders can also force a temperature by hand.

input_boolean:
  radiateur_salon:
    name: Radiateur salon (simulé)
    icon: mdi:radiator
  radiateur_bureau:
    name: Radiateur bureau (simulé)
    icon: mdi:radiator
  radiateur_chambre:
    name: Radiateur chambre (simulé)
    icon: mdi:radiator
  radiateur_cuisine:
    name: Radiateur cuisine (simulé)
    icon: mdi:radiator
  radiateur_amis:
    name: Radiateur chambre d'amis (simulé)
    icon: mdi:radiator

input_number:
  temperature_salon:
    name: Température salon (simulée)
    min: 5
    max: 30
    step: 0.1
    initial: 19
    unit_of_measurement: "°C"
    mode: box
  temperature_bureau:
    name: Température bureau (simulée)
    min: 5
    max: 30
    step: 0.1
    initial: 18
    unit_of_measurement: "°C"
    mode: box
  temperature_chambre:
    name: Température chambre (simulée)
    min: 5
    max: 30
    step: 0.1
    initial: 17
    unit_of_measurement: "°C"
    mode: box
  temperature_cuisine:
    name: Température cuisine (simulée)
    min: 5
    max: 30
    step: 0.1
    initial: 18
    unit_of_measurement: "°C"
    mode: box
  temperature_amis:
    name: Température chambre d'amis (simulée)
    min: 5
    max: 30
    step: 0.1
    initial: 16
    unit_of_measurement: "°C"
    mode: box
  temperature_exterieure:
    name: Température extérieure (simulée)
    min: -10
    max: 30
    step: 0.1
    initial: 8
    unit_of_measurement: "°C"
    mode: box

template:
  - sensor:
      - name: Température salon
        unique_id: sim_temperature_salon
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ states('input_number.temperature_salon') }}"
        # Real sensors report regularly even when the value does not change: without it,
        # Versatile Thermostat goes into safety mode after an hour (no temperature received)
        attributes:
          measured_at: "{{ now().replace(second=0, microsecond=0).isoformat() }}"
      - name: Température bureau
        unique_id: sim_temperature_bureau
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ states('input_number.temperature_bureau') }}"
        # Real sensors report regularly even when the value does not change: without it,
        # Versatile Thermostat goes into safety mode after an hour (no temperature received)
        attributes:
          measured_at: "{{ now().replace(second=0, microsecond=0).isoformat() }}"
      - name: Température chambre
        unique_id: sim_temperature_chambre
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ states('input_number.temperature_chambre') }}"
        # Real sensors report regularly even when the value does not change: without it,
        # Versatile Thermostat goes into safety mode after an hour (no temperature received)
        attributes:
          measured_at: "{{ now().replace(second=0, microsecond=0).isoformat() }}"
      - name: Température cuisine
        unique_id: sim_temperature_cuisine
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ states('input_number.temperature_cuisine') }}"
        attributes:
          measured_at: "{{ now().replace(second=0, microsecond=0).isoformat() }}"
      - name: Température chambre d'amis
        unique_id: sim_temperature_amis
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ states('input_number.temperature_amis') }}"
        attributes:
          measured_at: "{{ now().replace(second=0, microsecond=0).isoformat() }}"
      - name: Température extérieure
        unique_id: sim_temperature_exterieure
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ states('input_number.temperature_exterieure') }}"
        # Real sensors report regularly even when the value does not change: without it,
        # Versatile Thermostat goes into safety mode after an hour (no temperature received)
        attributes:
          measured_at: "{{ now().replace(second=0, microsecond=0).isoformat() }}"

automation:
  - id: sim_evolution_temperatures
    alias: "Simulation - évolution des températures"
    mode: single
    triggers:
      - trigger: time_pattern
        seconds: "/30"
    actions:
      - repeat:
          for_each: [salon, bureau, chambre, cuisine, amis]
          sequence:
            - action: input_number.set_value
              target:
                entity_id: "input_number.temperature_{{ repeat.item }}"
              data:
                value: >-
                  {%- set t = states('input_number.temperature_' ~ repeat.item) | float(18) -%}
                  {%- set ext = states('input_number.temperature_exterieure') | float(8) -%}
                  {%- if is_state('input_boolean.radiateur_' ~ repeat.item, 'on') -%}
                    {{ [t + 0.2, 30] | min | round(1) }}
                  {%- else -%}
                    {{ [t - (t - ext) * 0.02, ext] | max | round(1) }}
                  {%- endif -%}

# The two other kinds of thermostats (see docs/phase-2-plan.md):
# - no presets: Home Assistant's generic_thermostat (YAML: its UI flow only accepts a switch or a fan);
# - standard presets (eco, comfort, away, boost; no frost): dev/sim_climate.
climate:
  - platform: generic_thermostat
    name: Cuisine
    unique_id: sim_generic_cuisine
    heater: input_boolean.radiateur_cuisine
    target_sensor: sensor.temperature_cuisine
    min_temp: 7
    max_temp: 25
    target_temp: 17
    initial_hvac_mode: heat
    precision: 0.5
  - platform: sim_climate
    name: Chambre d'amis
    unique_id: sim_climate_amis
    heater: input_boolean.radiateur_amis
    sensor: sensor.temperature_amis
