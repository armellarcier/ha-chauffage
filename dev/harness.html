<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chauffage test harness</title>
  <!--
    Test harness without HA: fake hass (states, sensors, events), fake ha-card
    (asynchronous rendering like the real Lit component) and a more-info dialog mock-up.
    Run from the repository root:  python3 -m http.server 8000 (see CONTRIBUTING.md)
    then open http://<host>:8000/dev/harness.html
  -->
  <style>
    body { font-family: Roboto, system-ui, sans-serif; background:#fafafa; padding:20px; max-width:780px; margin:auto;
      --primary-color:#03a9f4; --primary-text-color:#212121; --secondary-text-color:#727272;
      --divider-color:#e0e0e0; --card-background-color:#fff; --secondary-background-color:#f0f0f0; }
    .tools { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
    .tools button { padding:6px 10px; border-radius:6px; border:1px solid #ccc; background:#fff; cursor:pointer; }
  </style>
</head>
<body>
  <div class="tools">
    <button onclick="openMoreInfo('climate.salon')">More-info: Salon</button>
    <button onclick="openMoreInfo('climate.bureau')">More-info: Bureau</button>
    <button onclick="openMoreInfo('climate.chambre')">More-info: Chambre (no schedule)</button>
    <button onclick="closeMoreInfo()">Close more-info</button>
    <button onclick="setMode('Absent')">Mode: Absent</button>
    <button onclick="setMode('Normal')">Mode: Normal</button>
  </div>
  <script type="module" src="./fake-ha.js"></script>
  <script type="module" src="../www/chauffage-programme-card.js"></script>
  <script type="module" src="./mount.js"></script>
</body>
</html>
