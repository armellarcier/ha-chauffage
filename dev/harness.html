<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banc de test chauffage</title>
  <!--
    Banc de test hors HA : faux hass (états, capteurs, événements), faux ha-card
    (rendu différé comme le vrai composant Lit) et maquette de la fenêtre de détail.
    Lancer depuis la racine du dépôt :  python3 -m http.server 8000
    puis ouvrir http://<hôte>:8000/dev/harness.html
  -->
  <style>
    body { font-family: Roboto, system-ui, sans-serif; background:#fafafa; padding:20px; max-width:780px; margin:auto;
      --primary-color:#03a9f4; --primary-text-color:#212121; --secondary-text-color:#727272;
      --divider-color:#e0e0e0; --card-background-color:#fff; --secondary-background-color:#f0f0f0; }
    .tools { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
    .tools button { padding:6px 10px; border-radius:6px; border:1px solid #ccc; background:#fff; cursor:pointer; }
  </style>
</head>
<body>
  <div class="tools">
    <button onclick="openMoreInfo('climate.salon')">Détail : Salon</button>
    <button onclick="openMoreInfo('climate.bureau')">Détail : Bureau</button>
    <button onclick="openMoreInfo('climate.chambre')">Détail : Chambre (sans programme)</button>
    <button onclick="closeMoreInfo()">Fermer le détail</button>
    <button onclick="setMode('Absent')">Mode Absent</button>
    <button onclick="setMode('Normal')">Mode Normal</button>
  </div>
  <script type="module" src="./fake-ha.js"></script>
  <script type="module" src="../www/chauffage-programme-card.js"></script>
  <script type="module" src="./mount.js"></script>
</body>
</html>
