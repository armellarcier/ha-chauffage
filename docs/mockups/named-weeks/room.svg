<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="572" viewBox="0 0 400 572">
  <style>
    text { font-family: Roboto, "Segoe UI", Helvetica, Arial, sans-serif; fill: #212121; }
    .h { font-size: 18px; font-weight: 500; }
    .tab { font-size: 13px; text-anchor: middle; }
    .tab.on { font-weight: 600; }
    .chip { font-size: 12px; text-anchor: middle; }
    .chip.on { fill: #fff; font-weight: 500; }
    .title { font-size: 16px; font-weight: 600; }
    .live { font-size: 12.5px; fill: #727272; }
    .sec { font-size: 12px; fill: #727272; font-weight: 600; letter-spacing: .3px; }
    .k { font-size: 10.5px; font-weight: 600; text-anchor: middle; }
    .dn { font-size: 13px; font-weight: 600; }
    .note { font-size: 11.5px; fill: #727272; }
    .tick { font-size: 10.5px; fill: #727272; text-anchor: middle; }
    .cmp { font-size: 12px; }
    .edit { font-size: 12.5px; fill: #0277bd; text-anchor: end; font-weight: 500; }
    .work { fill: #3949ab; } .off { fill: #00796b; } .school { fill: #5e35b1; }
    .wed { fill: #8e24aa; } .absent { fill: #9e9e9e; } .away { fill: #0277bd; }
  </style>
  <defs>
    <symbol id="emma-school" viewBox="0 0 24 1" preserveAspectRatio="none">
      <rect x="0" width="7" height="1" fill="#43a047"/><rect x="7" width="1" height="1" fill="#f57c00"/>
      <rect x="8" width="9" height="1" fill="#43a047"/><rect x="17" width="4" height="1" fill="#f57c00"/>
      <rect x="21" width="3" height="1" fill="#43a047"/>
    </symbol>
    <symbol id="leo-school" viewBox="0 0 24 1" preserveAspectRatio="none">
      <rect x="0" width="6.25" height="1" fill="#43a047"/><rect x="6.25" width="1.25" height="1" fill="#f57c00"/>
      <rect x="7.5" width="10" height="1" fill="#43a047"/><rect x="17.5" width="4.5" height="1" fill="#f57c00"/>
      <rect x="22" width="2" height="1" fill="#43a047"/>
    </symbol>
    <symbol id="emma-wed" viewBox="0 0 24 1" preserveAspectRatio="none">
      <rect x="0" width="7.5" height="1" fill="#43a047"/><rect x="7.5" width="1" height="1" fill="#f57c00"/>
      <rect x="8.5" width="3.5" height="1" fill="#43a047"/><rect x="12" width="9" height="1" fill="#f57c00"/>
      <rect x="21" width="3" height="1" fill="#43a047"/>
    </symbol>
    <symbol id="emma-lie" viewBox="0 0 24 1" preserveAspectRatio="none">
      <rect x="0" width="9" height="1" fill="#43a047"/><rect x="9" width="1.5" height="1" fill="#f57c00"/>
      <rect x="10.5" width="6.5" height="1" fill="#43a047"/><rect x="17" width="4.5" height="1" fill="#f57c00"/>
      <rect x="21.5" width="2.5" height="1" fill="#43a047"/>
    </symbol>
    <symbol id="eco" viewBox="0 0 24 1" preserveAspectRatio="none"><rect width="24" height="1" fill="#43a047"/></symbol>
    <symbol id="frost" viewBox="0 0 24 1" preserveAspectRatio="none"><rect width="24" height="1" fill="#29b6f6"/></symbol>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity=".22"/></filter>
  </defs>

  <rect width="400" height="572" fill="#eef0f2"/>
  <rect x="12" y="12" width="376" height="548" rx="12" fill="#fff" stroke="#e0e0e0"/>
  <text class="h" x="28" y="44">Chauffage</text>

  <rect x="28" y="58" width="344" height="34" rx="10" fill="#f0f0f0"/>
  <rect x="257" y="61" width="112" height="28" rx="8" fill="#fff" filter="url(#sh)"/>
  <text class="tab" x="87" y="80">Right now</text>
  <text class="tab" x="200" y="80">Occupants</text>
  <text class="tab on" x="313" y="80">Rooms</text>

  <!-- Room chips -->
  <rect x="28" y="104" width="62" height="26" rx="13" fill="#fff" stroke="#e0e0e0"/><text class="chip" x="59" y="121">Living</text>
  <rect x="96" y="104" width="66" height="26" rx="13" fill="#fff" stroke="#e0e0e0"/><text class="chip" x="129" y="121">Parents</text>
  <rect x="168" y="104" width="52" height="26" rx="13" fill="#fff" stroke="#e0e0e0"/><text class="chip" x="194" y="121">Léo</text>
  <rect x="226" y="104" width="62" height="26" rx="13" fill="#03a9f4"/><text class="chip on" x="257" y="121">Emma</text>
  <rect x="294" y="104" width="78" height="26" rx="13" fill="#fff" stroke="#e0e0e0"/><text class="chip" x="333" y="121">Guest, …</text>

  <text class="title" x="28" y="160">Emma's room</text><text class="live" x="372" y="160" text-anchor="end">19.2 °C</text>
  <text class="live" x="28" y="180">Follows</text>
  <rect x="78" y="166" width="96" height="22" rx="11" fill="#fff" stroke="#e0e0e0"/><text class="chip" x="126" y="181">Children ▾</text>

  <text class="sec" x="28" y="214">KIND OF DAY → HER DAY</text><text class="edit" x="372" y="214">+ Day</text>

  <g transform="translate(0,224)">
    <rect x="28" y="2" width="76" height="22" rx="5" fill="#ede7f6"/><text class="k school" x="66" y="17">School</text>
    <text class="dn" x="116" y="14">School</text>
    <use xlink:href="#emma-school" href="#emma-school" x="116" y="20" width="256" height="9"/>
  </g>
  <g transform="translate(0,264)">
    <rect x="28" y="2" width="76" height="22" rx="5" fill="#f3e5f5"/><text class="k wed" x="66" y="17">Wed</text>
    <text class="dn" x="116" y="14">Wednesday</text>
    <use xlink:href="#emma-wed" href="#emma-wed" x="116" y="20" width="256" height="9"/>
  </g>
  <g transform="translate(0,304)">
    <rect x="28" y="2" width="76" height="22" rx="5" fill="#e0f2f1"/><text class="k off" x="66" y="17">Off</text>
    <text class="dn" x="116" y="14">Lie-in</text>
    <use xlink:href="#emma-lie" href="#emma-lie" x="116" y="20" width="256" height="9"/>
  </g>
  <g transform="translate(0,344)">
    <rect x="28" y="2" width="76" height="22" rx="5" fill="#f5f5f5"/><text class="k absent" x="66" y="17">Absent</text>
    <text class="dn" x="116" y="14">Empty</text>
    <use xlink:href="#eco" href="#eco" x="116" y="20" width="256" height="9"/>
  </g>
  <g transform="translate(0,384)">
    <rect x="28" y="2" width="76" height="22" rx="5" fill="#e1f5fe"/><text class="k away" x="66" y="17">Home: Away</text>
    <text class="dn" x="116" y="14">Frost protection</text>
    <use xlink:href="#frost" href="#frost" x="116" y="20" width="256" height="9"/>
  </g>
  <text class="note" x="28" y="438">Other kinds of day (Work, Remote, Here) use her School day.</text>

  <line x1="28" y1="454" x2="372" y2="454" stroke="#e0e0e0"/>
  <text class="sec" x="28" y="478">SAME KIND OF DAY, ANOTHER OCCUPANT</text>
  <text class="tick" x="116" y="496">0</text><text class="tick" x="180" y="496">6</text>
  <text class="tick" x="244" y="496">12</text><text class="tick" x="308" y="496">18</text><text class="tick" x="366" y="496">24</text>
  <text class="cmp" x="28" y="514">Emma · School</text>
  <use xlink:href="#emma-school" href="#emma-school" x="116" y="505" width="256" height="10"/>
  <text class="cmp" x="28" y="536">Léo · School</text>
  <use xlink:href="#leo-school" href="#leo-school" x="116" y="527" width="256" height="10"/>
</svg>
