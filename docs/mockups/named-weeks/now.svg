<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="476" viewBox="0 0 400 476">
  <style>
    text { font-family: Roboto, "Segoe UI", Helvetica, Arial, sans-serif; fill: #212121; }
    .h { font-size: 18px; font-weight: 500; }
    .tab { font-size: 13px; text-anchor: middle; fill: #212121; }
    .tab.on { font-weight: 600; }
    .bar { font-size: 12.5px; fill: #727272; }
    .name { font-size: 14px; font-weight: 600; }
    .temp { font-size: 12.5px; fill: #727272; text-anchor: end; }
    .pill { font-size: 12px; font-weight: 600; fill: #fff; text-anchor: middle; }
    .why { font-size: 12px; fill: #727272; }
    .wk { font-weight: 600; fill: #212121; }
    .hand { fill: #0277bd; font-weight: 500; }
  </style>
  <defs>
    <!-- Days of named weeks, in hours (0-24) -->
    <symbol id="la-wd" viewBox="0 0 24 1" preserveAspectRatio="none">
      <rect x="0" width="6.5" height="1" fill="#43a047"/><rect x="6.5" width="2" height="1" fill="#f57c00"/>
      <rect x="8.5" width="9" height="1" fill="#43a047"/><rect x="17.5" width="5" height="1" fill="#f57c00"/>
      <rect x="22.5" width="1.5" height="1" fill="#43a047"/>
    </symbol>
    <symbol id="bed-wd" viewBox="0 0 24 1" preserveAspectRatio="none">
      <rect x="0" width="6.5" height="1" fill="#43a047"/><rect x="6.5" width="1" height="1" fill="#f57c00"/>
      <rect x="7.5" width="13.5" height="1" fill="#43a047"/><rect x="21" width="1.5" height="1" fill="#f57c00"/>
      <rect x="22.5" width="1.5" height="1" fill="#43a047"/>
    </symbol>
    <symbol id="office-wd" viewBox="0 0 24 1" preserveAspectRatio="none">
      <rect x="0" width="8.5" height="1" fill="#43a047"/><rect x="8.5" width="9.5" height="1" fill="#f57c00"/>
      <rect x="18" width="6" height="1" fill="#43a047"/>
    </symbol>
    <pattern id="stripes" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#e53935"/><rect width="2.5" height="6" fill="#ef6f6c"/>
    </pattern>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity=".22"/></filter>
  </defs>

  <rect width="400" height="476" fill="#eef0f2"/>
  <rect x="12" y="12" width="376" height="452" rx="12" fill="#fff" stroke="#e0e0e0"/>
  <text class="h" x="28" y="44">Chauffage</text>

  <!-- Views -->
  <rect x="28" y="58" width="344" height="34" rx="10" fill="#f0f0f0"/>
  <rect x="31" y="61" width="112" height="28" rx="8" fill="#fff" filter="url(#sh)"/>
  <text class="tab on" x="87" y="80">Right now</text>
  <text class="tab" x="200" y="80">Schedules</text>
  <text class="tab" x="313" y="80">Weeks</text>

  <!-- Active schedule -->
  <rect x="28" y="104" width="344" height="30" rx="8" fill="#f0f0f0"/>
  <circle cx="42" cy="119" r="4" fill="#43a047"/>
  <text class="bar" x="52" y="123">Active schedule: <tspan font-weight="600" fill="#212121">Normal</tspan></text>
  <text class="bar" x="362" y="123" text-anchor="end">default · Tue 18:10</text>

  <!-- Living room -->
  <g transform="translate(0,146)">
    <text class="name" x="28" y="20">Living room</text>
    <text class="temp" x="270" y="20">19.6 °C</text>
    <rect x="278" y="5" width="94" height="22" rx="11" fill="#f57c00"/><text class="pill" x="325" y="20">Comfort 20°</text>
    <text class="why" x="28" y="40"><tspan class="wk">Living area</tspan> · schedule Normal</text>
    <rect x="28" y="48" width="344" height="7" rx="3.5" fill="#f0f0f0"/>
    <use xlink:href="#la-wd" href="#la-wd" x="28" y="48" width="344" height="7"/>
    <rect x="287.5" y="45" width="2" height="13" fill="#212121"/>
    <line x1="28" y1="62" x2="372" y2="62" stroke="#e0e0e0"/>
  </g>

  <!-- Kitchen -->
  <g transform="translate(0,208)">
    <text class="name" x="28" y="20">Kitchen</text>
    <text class="temp" x="270" y="20">19.1 °C</text>
    <rect x="278" y="5" width="94" height="22" rx="11" fill="#f57c00"/><text class="pill" x="325" y="20">Comfort 20°</text>
    <text class="why" x="28" y="40"><tspan class="wk">Living area</tspan> · schedule Normal</text>
    <use xlink:href="#la-wd" href="#la-wd" x="28" y="48" width="344" height="7"/>
    <rect x="287.5" y="45" width="2" height="13" fill="#212121"/>
    <line x1="28" y1="62" x2="372" y2="62" stroke="#e0e0e0"/>
  </g>

  <!-- Parents' bedroom -->
  <g transform="translate(0,270)">
    <text class="name" x="28" y="20">Parents' bedroom</text>
    <text class="temp" x="270" y="20">17.4 °C</text>
    <rect x="278" y="5" width="94" height="22" rx="11" fill="#43a047"/><text class="pill" x="325" y="20">Eco 17°</text>
    <text class="why" x="28" y="40"><tspan class="wk">Bedroom in use</tspan> · schedule Normal</text>
    <use xlink:href="#bed-wd" href="#bed-wd" x="28" y="48" width="344" height="7"/>
    <rect x="287.5" y="45" width="2" height="13" fill="#212121"/>
    <line x1="28" y1="62" x2="372" y2="62" stroke="#e0e0e0"/>
  </g>

  <!-- Guest room: week chosen by hand -->
  <g transform="translate(0,332)">
    <rect x="20" y="0" width="360" height="62" rx="8" fill="#e1f5fe" opacity=".55"/>
    <text class="name" x="28" y="20">Guest room</text>
    <text class="temp" x="270" y="20">16.8 °C</text>
    <rect x="278" y="5" width="94" height="22" rx="11" fill="#43a047"/><text class="pill" x="325" y="20">Eco 16°</text>
    <text class="why" x="28" y="40"><tspan class="wk">Bedroom in use</tspan> · <tspan class="hand">chosen by hand, until Sun 18:00</tspan></text>
    <text class="why" x="372" y="40" text-anchor="end" style="fill:#0277bd;font-size:15px">×</text>
    <use xlink:href="#bed-wd" href="#bed-wd" x="28" y="48" width="344" height="7"/>
    <rect x="287.5" y="45" width="2" height="13" fill="#212121"/>
    <line x1="28" y1="62" x2="372" y2="62" stroke="#e0e0e0"/>
  </g>

  <!-- Office: override -->
  <g transform="translate(0,394)">
    <text class="name" x="28" y="20">Office</text>
    <text class="temp" x="270" y="20">21.4 °C</text>
    <rect x="278" y="5" width="94" height="22" rx="11" fill="#e53935"/><text class="pill" x="325" y="20">Boost 22°</text>
    <text class="why" x="28" y="40"><tspan class="wk">Override</tspan> · until 19:30, then <tspan class="wk">Home office</tspan></text>
    <use xlink:href="#office-wd" href="#office-wd" x="28" y="48" width="344" height="7"/>
    <rect x="279.2" y="48" width="28.7" height="7" fill="url(#stripes)"/>
    <rect x="287.5" y="45" width="2" height="13" fill="#212121"/>
  </g>
</svg>
