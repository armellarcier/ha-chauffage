<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="668" viewBox="0 0 400 668">
  <style>
    text { font-family: Roboto, "Segoe UI", Helvetica, Arial, sans-serif; fill: #212121; }
    .h { font-size: 18px; font-weight: 500; }
    .tab { font-size: 13px; text-anchor: middle; }
    .tab.on { font-weight: 600; }
    .hint { font-size: 12.5px; fill: #727272; }
    .tick { font-size: 10.5px; fill: #727272; text-anchor: middle; }
    .name { font-size: 13.5px; font-weight: 600; }
    .used { font-size: 11.5px; fill: #727272; }
    .edit { font-size: 12.5px; fill: #0277bd; text-anchor: end; font-weight: 500; }
    .new { font-size: 13px; fill: #727272; text-anchor: middle; }
  </style>
  <defs>
    <symbol id="liv-work" viewBox="0 0 24 1" preserveAspectRatio="none">
      <rect x="0" width="6.5" height="1" fill="#43a047"/><rect x="6.5" width="2" height="1" fill="#f57c00"/>
      <rect x="8.5" width="9" height="1" fill="#43a047"/><rect x="17.5" width="5" height="1" fill="#f57c00"/>
      <rect x="22.5" width="1.5" height="1" fill="#43a047"/>
    </symbol>
    <symbol id="liv-home" viewBox="0 0 24 1" preserveAspectRatio="none">
      <rect x="0" width="8" height="1" fill="#43a047"/><rect x="8" width="15" height="1" fill="#f57c00"/>
      <rect x="23" width="1" height="1" fill="#43a047"/>
    </symbol>
    <symbol id="bed-school" viewBox="0 0 24 1" preserveAspectRatio="none">
      <rect x="0" width="6.5" height="1" fill="#43a047"/><rect x="6.5" width="1" height="1" fill="#f57c00"/>
      <rect x="7.5" width="13.5" height="1" fill="#43a047"/><rect x="21" width="1.5" height="1" fill="#f57c00"/>
      <rect x="22.5" width="1.5" height="1" fill="#43a047"/>
    </symbol>
    <symbol id="bed-wed" viewBox="0 0 24 1" preserveAspectRatio="none">
      <rect x="0" width="6.5" height="1" fill="#43a047"/><rect x="6.5" width="1" height="1" fill="#f57c00"/>
      <rect x="7.5" width="4.5" height="1" fill="#43a047"/><rect x="12" width="6" height="1" fill="#f57c00"/>
      <rect x="18" width="3" height="1" fill="#43a047"/><rect x="21" width="1.5" height="1" fill="#f57c00"/>
      <rect x="22.5" width="1.5" height="1" fill="#43a047"/>
    </symbol>
    <symbol id="bed-lie" viewBox="0 0 24 1" preserveAspectRatio="none">
      <rect x="0" width="8.5" height="1" fill="#43a047"/><rect x="8.5" width="1" height="1" fill="#f57c00"/>
      <rect x="9.5" width="12" height="1" fill="#43a047"/><rect x="21.5" width="1.5" height="1" fill="#f57c00"/>
      <rect x="23" width="1" height="1" fill="#43a047"/>
    </symbol>
    <symbol id="office" viewBox="0 0 24 1" preserveAspectRatio="none">
      <rect x="0" width="8.5" height="1" fill="#43a047"/><rect x="8.5" width="9.5" height="1" fill="#f57c00"/>
      <rect x="18" width="6" height="1" fill="#43a047"/>
    </symbol>
    <symbol id="eco" viewBox="0 0 24 1" preserveAspectRatio="none"><rect width="24" height="1" fill="#43a047"/></symbol>
    <symbol id="frost" viewBox="0 0 24 1" preserveAspectRatio="none"><rect width="24" height="1" fill="#29b6f6"/></symbol>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity=".22"/></filter>
  </defs>

  <rect width="400" height="668" fill="#eef0f2"/>
  <rect x="12" y="12" width="376" height="644" rx="12" fill="#fff" stroke="#e0e0e0"/>
  <text class="h" x="28" y="44">Chauffage</text>

  <rect x="28" y="58" width="344" height="34" rx="10" fill="#f0f0f0"/>
  <rect x="257" y="61" width="112" height="28" rx="8" fill="#fff" filter="url(#sh)"/>
  <text class="tab" x="87" y="80">Right now</text>
  <text class="tab" x="200" y="80">Schedules</text>
  <text class="tab on" x="313" y="80">Days</text>

  <text class="hint" x="28" y="114">Named days, used by the weeks of the schedules.</text>
  <text class="tick" x="32" y="132">0</text><text class="tick" x="114" y="132">6</text>
  <text class="tick" x="200" y="132">12</text><text class="tick" x="286" y="132">18</text>
  <text class="tick" x="366" y="132">24</text>

  <g transform="translate(0,140)">
    <text class="name" x="28" y="16">Living · working day</text><text class="edit" x="372" y="16">Edit</text>
    <text class="used" x="28" y="31">Living room, Kitchen · Mon–Fri in Normal</text>
    <use xlink:href="#liv-work" href="#liv-work" x="28" y="38" width="344" height="10"/>
    <line x1="28" y1="56" x2="372" y2="56" stroke="#e0e0e0"/>
  </g>
  <g transform="translate(0,198)">
    <text class="name" x="28" y="16">Living · at home</text><text class="edit" x="372" y="16">Edit</text>
    <text class="used" x="28" y="31">Living room, Kitchen · Sat–Sun in Normal</text>
    <use xlink:href="#liv-home" href="#liv-home" x="28" y="38" width="344" height="10"/>
    <line x1="28" y1="56" x2="372" y2="56" stroke="#e0e0e0"/>
  </g>
  <g transform="translate(0,256)">
    <text class="name" x="28" y="16">Bedroom · school day</text><text class="edit" x="372" y="16">Edit</text>
    <text class="used" x="28" y="31">Parents' bedroom Mon–Fri · Children's bedroom Mon, Tue, Thu, Fri</text>
    <use xlink:href="#bed-school" href="#bed-school" x="28" y="38" width="344" height="10"/>
    <line x1="28" y1="56" x2="372" y2="56" stroke="#e0e0e0"/>
  </g>
  <g transform="translate(0,314)">
    <text class="name" x="28" y="16">Bedroom · Wednesday</text><text class="edit" x="372" y="16">Edit</text>
    <text class="used" x="28" y="31">Children's bedroom · Wed</text>
    <use xlink:href="#bed-wed" href="#bed-wed" x="28" y="38" width="344" height="10"/>
    <line x1="28" y1="56" x2="372" y2="56" stroke="#e0e0e0"/>
  </g>
  <g transform="translate(0,372)">
    <text class="name" x="28" y="16">Bedroom · lie-in</text><text class="edit" x="372" y="16">Edit</text>
    <text class="used" x="28" y="31">Both bedrooms Sat–Sun · <tspan style="fill:#0277bd">Guest room Fri 24 – Sun 26</tspan></text>
    <use xlink:href="#bed-lie" href="#bed-lie" x="28" y="38" width="344" height="10"/>
    <line x1="28" y1="56" x2="372" y2="56" stroke="#e0e0e0"/>
  </g>
  <g transform="translate(0,430)">
    <text class="name" x="28" y="16">Office · remote work</text><text class="edit" x="372" y="16">Edit</text>
    <text class="used" x="28" y="31">Office · Tue, Thu</text>
    <use xlink:href="#office" href="#office" x="28" y="38" width="344" height="10"/>
    <line x1="28" y1="56" x2="372" y2="56" stroke="#e0e0e0"/>
  </g>
  <g transform="translate(0,488)">
    <text class="name" x="28" y="16">Empty</text><text class="edit" x="372" y="16">Edit</text>
    <text class="used" x="28" y="31">Guest room every day · Office Mon, Wed, Fri–Sun</text>
    <use xlink:href="#eco" href="#eco" x="28" y="38" width="344" height="10"/>
    <line x1="28" y1="56" x2="372" y2="56" stroke="#e0e0e0"/>
  </g>
  <g transform="translate(0,546)">
    <text class="name" x="28" y="16">Frost protection</text><text class="edit" x="372" y="16">Edit</text>
    <text class="used" x="28" y="31">Every thermostat, every day in Away</text>
    <use xlink:href="#frost" href="#frost" x="28" y="38" width="344" height="10"/>
  </g>

  <rect x="28" y="612" width="344" height="32" rx="8" fill="none" stroke="#bdbdbd" stroke-dasharray="4 3"/>
  <text class="new" x="200" y="632">+ New named day</text>
</svg>
