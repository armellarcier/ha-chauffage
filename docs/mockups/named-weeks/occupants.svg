<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <style>
    text { font-family: Roboto, "Segoe UI", Helvetica, Arial, sans-serif; fill: #212121; }
    .h { font-size: 18px; font-weight: 500; }
    .tab { font-size: 13px; text-anchor: middle; }
    .tab.on { font-weight: 600; }
    .hint { font-size: 12px; fill: #727272; }
    .dh { font-size: 11px; fill: #727272; text-anchor: middle; }
    .dh.today { fill: #0288d1; font-weight: 700; }
    .occ { font-size: 12.5px; font-weight: 600; }
    .src { font-size: 10px; fill: #727272; }
    .k { font-size: 9.5px; font-weight: 600; text-anchor: middle; }
    .sec { font-size: 12px; fill: #727272; font-weight: 600; letter-spacing: .3px; }
    .row { font-size: 12.5px; }
    .why { font-size: 11.5px; fill: #727272; }
    .work { fill: #3949ab; } .off { fill: #00796b; } .remote { fill: #6d4c41; } .school { fill: #5e35b1; }
    .wed { fill: #8e24aa; } .absent { fill: #9e9e9e; } .present { fill: #ef6c00; }
  </style>
  <defs>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity=".22"/></filter>
  </defs>

  <rect width="400" height="560" fill="#eef0f2"/>
  <rect x="12" y="12" width="376" height="536" rx="12" fill="#fff" stroke="#e0e0e0"/>
  <text class="h" x="28" y="44">Chauffage</text>

  <rect x="28" y="58" width="344" height="34" rx="10" fill="#f0f0f0"/>
  <rect x="144" y="61" width="112" height="28" rx="8" fill="#fff" filter="url(#sh)"/>
  <text class="tab" x="87" y="80">Right now</text>
  <text class="tab on" x="200" y="80">Occupants</text>
  <text class="tab" x="313" y="80">Rooms</text>

  <text class="hint" x="28" y="114">The kind of day of each occupant, this week (8–14 Nov).</text>

  <!-- Today column -->
  <rect x="135" y="124" width="38" height="196" rx="6" fill="#e1f5fe" opacity=".6"/>
  <text class="dh" x="115" y="138">Mon</text><text class="dh today" x="154" y="138">Tue</text>
  <text class="dh" x="193" y="138">Wed</text><text class="dh" x="232" y="138">Thu</text>
  <text class="dh" x="271" y="138">Fri</text><text class="dh" x="310" y="138">Sat</text>
  <text class="dh" x="349" y="138">Sun</text>

  <!-- Home -->
  <g transform="translate(0,148)">
    <text class="occ" x="28" y="14">Home</text><text class="src" x="28" y="27">workday</text>
    <g>
      <rect x="97" y="2" width="36" height="22" rx="5" fill="#e8eaf6"/><text class="k work" x="115" y="17">Work</text>
      <rect x="136" y="2" width="36" height="22" rx="5" fill="#e8eaf6"/><text class="k work" x="154" y="17">Work</text>
      <rect x="175" y="2" width="36" height="22" rx="5" fill="#e8eaf6"/><text class="k work" x="193" y="17">Work</text>
      <rect x="214" y="2" width="36" height="22" rx="5" fill="#e0f2f1" stroke="#00796b" stroke-dasharray="3 2"/><text class="k off" x="232" y="17">Off</text>
      <rect x="253" y="2" width="36" height="22" rx="5" fill="#e8eaf6"/><text class="k work" x="271" y="17">Work</text>
      <rect x="292" y="2" width="36" height="22" rx="5" fill="#e0f2f1"/><text class="k off" x="310" y="17">Off</text>
      <rect x="331" y="2" width="36" height="22" rx="5" fill="#e0f2f1"/><text class="k off" x="349" y="17">Off</text>
    </g>
  </g>
  <!-- Alex -->
  <g transform="translate(0,190)">
    <text class="occ" x="28" y="14">Alex</text><text class="src" x="28" y="27">person</text>
    <rect x="97" y="2" width="36" height="22" rx="5" fill="#e8eaf6"/><text class="k work" x="115" y="17">Work</text>
    <rect x="136" y="2" width="36" height="22" rx="5" fill="#efebe9"/><text class="k remote" x="154" y="17">Remote</text>
    <rect x="175" y="2" width="36" height="22" rx="5" fill="#e8eaf6"/><text class="k work" x="193" y="17">Work</text>
    <rect x="214" y="2" width="36" height="22" rx="5" fill="#e0f2f1" stroke="#00796b" stroke-dasharray="3 2"/><text class="k off" x="232" y="17">Off</text>
    <rect x="253" y="2" width="36" height="22" rx="5" fill="#e8eaf6"/><text class="k work" x="271" y="17">Work</text>
    <rect x="292" y="2" width="36" height="22" rx="5" fill="#e0f2f1"/><text class="k off" x="310" y="17">Off</text>
    <rect x="331" y="2" width="36" height="22" rx="5" fill="#e0f2f1"/><text class="k off" x="349" y="17">Off</text>
  </g>
  <!-- Children -->
  <g transform="translate(0,232)">
    <text class="occ" x="28" y="14">Children</text><text class="src" x="28" y="27">calendar</text>
    <rect x="97" y="2" width="36" height="22" rx="5" fill="#ede7f6"/><text class="k school" x="115" y="17">School</text>
    <rect x="136" y="2" width="36" height="22" rx="5" fill="#ede7f6"/><text class="k school" x="154" y="17">School</text>
    <rect x="175" y="2" width="36" height="22" rx="5" fill="#f3e5f5"/><text class="k wed" x="193" y="17">Wed</text>
    <rect x="214" y="2" width="36" height="22" rx="5" fill="#e0f2f1" stroke="#00796b" stroke-dasharray="3 2"/><text class="k off" x="232" y="17">Off</text>
    <rect x="253" y="2" width="36" height="22" rx="5" fill="#ede7f6"/><text class="k school" x="271" y="17">School</text>
    <rect x="292" y="2" width="36" height="22" rx="5" fill="#e0f2f1"/><text class="k off" x="310" y="17">Off</text>
    <rect x="331" y="2" width="36" height="22" rx="5" fill="#f5f5f5" stroke="#9e9e9e" stroke-dasharray="3 2"/><text class="k absent" x="349" y="17">Absent</text>
  </g>
  <!-- Guests -->
  <g transform="translate(0,274)">
    <text class="occ" x="28" y="14">Guests</text><text class="src" x="28" y="27">by hand</text>
    <rect x="97" y="2" width="36" height="22" rx="5" fill="#f5f5f5"/><text class="k absent" x="115" y="17">Absent</text>
    <rect x="136" y="2" width="36" height="22" rx="5" fill="#f5f5f5"/><text class="k absent" x="154" y="17">Absent</text>
    <rect x="175" y="2" width="36" height="22" rx="5" fill="#f5f5f5"/><text class="k absent" x="193" y="17">Absent</text>
    <rect x="214" y="2" width="36" height="22" rx="5" fill="#f5f5f5"/><text class="k absent" x="232" y="17">Absent</text>
    <rect x="253" y="2" width="36" height="22" rx="5" fill="#fff3e0" stroke="#ef6c00" stroke-dasharray="3 2"/><text class="k present" x="271" y="17">Here</text>
    <rect x="292" y="2" width="36" height="22" rx="5" fill="#fff3e0" stroke="#ef6c00" stroke-dasharray="3 2"/><text class="k present" x="310" y="17">Here</text>
    <rect x="331" y="2" width="36" height="22" rx="5" fill="#fff3e0" stroke="#ef6c00" stroke-dasharray="3 2"/><text class="k present" x="349" y="17">Here</text>
  </g>

  <text class="hint" x="28" y="338">Dashed: changed for that date, on top of the occupant's week.</text>
  <line x1="28" y1="352" x2="372" y2="352" stroke="#e0e0e0"/>

  <text class="sec" x="28" y="376">CHANGES ON DATES</text>
  <g transform="translate(0,388)">
    <text class="row" x="28" y="14">Thu 11 Nov · Everyone · <tspan font-weight="600" class="off">Off</tspan></text>
    <text class="why" x="28" y="30">public holiday, from binary_sensor.workday</text>
  </g>
  <g transform="translate(0,428)">
    <text class="row" x="28" y="14">Fri 12 – Sun 14 · Guests · <tspan font-weight="600" class="present">Here</tspan></text>
    <text class="why" x="28" y="30">by hand</text>
  </g>
  <g transform="translate(0,468)">
    <text class="row" x="28" y="14">Sun 14 – Sat 20 · Children · <tspan font-weight="600" class="absent">Absent</tspan></text>
    <text class="why" x="28" y="30">calendar.shared_custody</text>
  </g>
  <text class="hint" x="28" y="530">Each room answers with its own day.</text>
</svg>
