set_override:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°"
    preset:
      selector:
        select:
          options: [comfort, eco, boost, frost]
          translation_key: preset
    duration:
      selector:
        number:
          min: 15
          max: 1440
          step: 15
          unit_of_measurement: min
    end:
      selector:
        datetime:

clear_override:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: climate

activate_schedule:
  fields:
    schedule:
      required: true
      example: normal
      selector:
        text:
